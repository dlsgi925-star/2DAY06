<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>토익 스터디 팔백가자 모집</title>
  <style>
    :root {
      --bg: #f3f7fd;
      --card: #ffffff;
      --text: #1f2a44;
      --muted: #5f6f8c;
      --blue: #2563eb;
      --blue-dark: #1e3a8a;
      --blue-soft: #dbeafe;
      --stripe: #eff5ff;
      --line: #d3e0f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 17px;
      line-height: 1.6;
      word-break: keep-all;
    }
    header {
      padding: 36px 16px 32px;
      text-align: center;
      background: var(--blue-dark);
      color: #fff;
    }
    header h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: .08em; }
    header p { margin: 0; color: #cfe0ff; }
    main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
    section {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(30, 58, 138, .1);
    }
    h2 {
      margin: 0 0 14px;
      padding-left: 10px;
      border-left: 4px solid var(--blue);
      font-size: 1.15rem;
      color: var(--blue-dark);
    }
    section ul { list-style: none; margin: 0; padding: 0; }
    section li {
      padding: 10px 4px;
      border-top: 1px solid var(--line);
    }
    section li:first-child { border-top: 0; }

    /* 탭 */
    #tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    #tabs button {
      flex: 1;
      min-height: 46px;
      border: 1px solid var(--blue);
      border-radius: 10px;
      background: var(--card);
      color: var(--blue);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #tabs button[aria-selected="true"] {
      background: var(--blue);
      color: #fff;
    }

    /* 표 + 줄무늬 */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; text-align: left; }
    thead th { background: var(--blue-dark); color: #fff; }
    thead th:first-child { border-radius: 10px 0 0 0; }
    thead th:last-child { border-radius: 0 10px 0 0; }
    tbody td:first-child { width: 32%; font-weight: 700; color: var(--blue-dark); }
    tbody tr:nth-child(odd) { background: var(--blue-soft); }
    tbody tr:nth-child(even) { background: var(--stripe); }

    /* 지원 링크 */
    #apply-link {
      display: block;
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>팔백가자</h1>
    <p>토익 800점 목표 스터디 · 모집 4명</p>
  </header>

  <main>
    <section id="schedule">
      <h2>일정</h2>
      <ul>
        <li>기간: 8주</li>
        <li>시간: 매주 토요일 오전 10시~12시</li>
        <li>방식: 온라인 (구글 미트)</li>
      </ul>
    </section>

    <section id="plan">
      <h2>주차별 계획</h2>

      <!-- 탭 버튼: 2단계에서 누르면 해당 표만 보이게 연결 -->
      <div id="tabs">
        <button type="button" data-tab="plan-1">1~2주</button>
        <button type="button" data-tab="plan-2">3~4주</button>
        <button type="button" data-tab="plan-3">5~6주</button>
        <button type="button" data-tab="plan-4">7~8주</button>
      </div>

      <div class="tab-panel" id="plan-1">
        <table>
          <thead><tr><th>기간</th><th>계획</th></tr></thead>
          <tbody><tr><td>1~2주</td><td>LC 파트 1~4</td></tr></tbody>
        </table>
      </div>

      <div class="tab-panel" id="plan-2">
        <table>
          <thead><tr><th>기간</th><th>계획</th></tr></thead>
          <tbody><tr><td>3~4주</td><td>RC 파트 5~6</td></tr></tbody>
        </table>
      </div>

      <div class="tab-panel" id="plan-3">
        <table>
          <thead><tr><th>기간</th><th>계획</th></tr></thead>
          <tbody><tr><td>5~6주</td><td>RC 파트 7</td></tr></tbody>
        </table>
      </div>

      <div class="tab-panel" id="plan-4">
        <table>
          <thead><tr><th>기간</th><th>계획</th></tr></thead>
          <tbody><tr><td>7~8주</td><td>실전 모의고사</td></tr></tbody>
        </table>
      </div>
    </section>

    <section id="rules">
      <h2>규칙</h2>
      <ul>
        <li>결석 2번이면 탈퇴</li>
        <li>매주 단어 100개 시험</li>
      </ul>
    </section>

    <section id="apply">
      <h2>지원 방법</h2>
      <ul>
        <li>오픈채팅방 "팔백가자"에 자기소개 한 줄</li>
        <li>마감: 2026년 11월 30일</li>
      </ul>
      <!-- 오픈채팅방 주소를 받으면 href에 넣기 -->
      <a id="apply-link" href="#">오픈채팅방 "팔백가자"</a>
    </section>
  </main>

  <script>
    var tabButtons = document.querySelectorAll('#tabs button');
    var panels = document.querySelectorAll('.tab-panel');

    // 선택한 탭의 표만 보여주고, 선택된 탭 버튼을 표시
    function showTab(id) {
      panels.forEach(function (panel) {
        panel.hidden = panel.id !== id;
      });
      tabButtons.forEach(function (btn) {
        btn.setAttribute('aria-selected', String(btn.dataset.tab === id));
      });
    }

    tabButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        showTab(btn.dataset.tab);
      });
    });

    // 처음에는 1~2주 탭을 보여줌
    showTab('plan-1');
  </script>
</body>
</html>
